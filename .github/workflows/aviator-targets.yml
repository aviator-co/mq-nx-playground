name: Fetch Aviator targets

on:
  pull_request:

jobs:
  affected-targets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Compute affected targets and post to Aviator
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_BASE_REF"
          PR_NUMBER=${{ github.event.number }}
          TARGETS_JSON=$(npx nx show projects --affected --base FETCH_HEAD --head HEAD --json)
          echo "Affected targets: $TARGETS_JSON"
          curl -X POST -H "Authorization: Bearer ${{ secrets.AVIATOR_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "update",
              "pull_request": {
                  "number": '"$PR_NUMBER"',
                  "repository": {"name": "${{ github.event.repository.name }}", "org": "${{ github.repository_owner }}"},
                  "affected_targets": '"$TARGETS_JSON"'
              }
            }' https://api.aviator.co/api/v1/pull_request/
